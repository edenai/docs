# The page title rules live in CLAUDE.md ("Page Titles and Descriptions"),
# which Claude Code follows when writing pages and CodeRabbit reads as a code
# guideline. Edit the rules there; this file only says when to apply them.

inheritance: true  # anything not set here comes from the organization settings

reviews:
  path_instructions:
    - path: "{index.mdx,v3/**/*.mdx}"
      instructions: |
        When this PR adds a page or changes its `title`, `sidebarTitle` or `description`, review them against "Page Titles and Descriptions" in CLAUDE.md, and suggest a concrete better title or description for any that falls short. Skip pages under `v3/expert-models/features/`, which `scripts/generate_features.py` generates.

    - path: "scripts/generate_features.py"
      instructions: |
        When this PR changes how the feature pages' `title` or `description` is built, check the result against "Page Titles and Descriptions" in CLAUDE.md.

    - path: "docs.json"
      instructions: |
        If this PR moves or deletes a page that exists on the base branch, check that `redirects` gains an entry from its old path, to its new path or, for a deleted page, to the closest remaining page. Without it the old URL returns 404 and loses its search ranking.

  # Custom checks need a paid CodeRabbit plan; without one this is skipped.
  pre_merge_checks:
    custom_checks:
      - name: "New page title targets a search query"
        mode: warning
        instructions: |
          Applies when the PR adds an .mdx page under v3/, or changes an existing page's `title` in a way that changes its main keyword. Pages under v3/expert-models/features/ are generated by scripts/generate_features.py and are exempt. If nothing applies, pass.
          Pass only if the PR description gives, for each such page, the search query its title targets and where that query came from (for example Google Search Console, a competitor's page title, or the product's own name).

knowledge_base:
  code_guidelines:
    enabled: true  # the default, kept explicit because the rules live in CLAUDE.md
