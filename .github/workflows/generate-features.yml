name: Generate AI Feature Docs

on:
  schedule:
    # Daily at 6 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate feature documentation
        run: python scripts/generate_features.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      # The org-level `agent-block` ruleset rejects pushes from
      # github-actions[bot] outside refs/heads/edenai-assistant/**.
      # edenai-docs-bot is on its bypass list, and a PR it opens runs
      # test-snippets.yml, which a GITHUB_TOKEN PR would not.
      - name: Get app token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "docs: update auto-generated AI feature pages"
          branch: auto/update-feature-docs
          title: "docs: update AI feature documentation"
          body: |
            Automated update of AI feature documentation pages from the
            production `/v3/info` API.

            This PR was generated by the `generate-features` workflow.
          labels: documentation, automated
          delete-branch: true
