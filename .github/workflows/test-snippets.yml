name: Test Documentation Snippets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v3/**/*.mdx'
      - '*.mdx'
      - 'tests/**'
  # The docs go stale against a moving API even when nobody edits them: a model
  # is retired, a response shape changes, a linked page moves. A PR run only
  # catches what a PR touches, so the suite also runs weekly against main.
  schedule:
    - cron: '0 6 * * 1'

# These tests share one Eden AI account, and teardown deletes every upload that
# appeared while they ran, so overlapping runs would delete each other's files.
# The group carries no ref on purpose: a run on another branch collides exactly
# as a second run of the same ref would, and update-dates.yml pushes a
# dateModified bump to every .mdx PR, starting one seconds after the other.
#
# Deliberately NOT cancel-in-progress: cleanup happens in pytest_sessionfinish,
# so cancelling orphans the keys and files a started run created. The next run
# clears the ones named after the samples before it starts. (A still-pending run
# carries no resources, so GitHub replacing it is harmless.)
concurrency:
  group: test-snippets
  cancel-in-progress: false

jobs:
  execute:
    name: Execution Tests
    runs-on: ubuntu-latest
    # The whole suite takes about a minute; anything near this is a hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          # atomic-agents, exercised by the Atomic Agents guide, needs 3.12+.
          python-version: '3.13'
      # node runs the JavaScript samples, strips the types off the TypeScript
      # ones, and supplies the tsc that checks them. 24 is what the docs tell
      # readers to use and what strips types without a flag.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install dependencies
        run: uv pip install -r tests/requirements-lock.txt --system
      # The packages the samples import. Pinned and locked, so a run tests the
      # docs rather than whatever npm resolved that morning.
      - name: Install snippet packages
        run: npm ci
        working-directory: tests

      # No credentials, so this still reports a snippet that is not valid
      # Python, bash or JavaScript on a run where the secrets are missing, and
      # it covers the blocks the execution suites hold back. The TypeScript
      # type check lives here too: it needs the SDK typings that npm just
      # installed, but no token. The only requests it makes are the
      # unauthenticated 404 probes that prove a dead endpoint still fails.
      - name: Check snippet syntax
        run: pytest tests/test_snippets_compile.py tests/test_snippet_extractor.py tests/test_js_script.py --no-cov
        env:
          EDEN_AI_BASE_URL: ${{ vars.EDEN_AI_BASE_URL || 'https://staging-api.edenai.run' }}

      - name: Run Python snippets
        run: pytest tests/test_snippets_execute.py
        env:
          EDEN_AI_BASE_URL: ${{ vars.EDEN_AI_BASE_URL || 'https://staging-api.edenai.run' }}
          EDEN_AI_SANDBOX_API_TOKEN: ${{ secrets.EDEN_AI_SANDBOX_TOKEN }}
          EDEN_AI_PRODUCTION_API_TOKEN: ${{ secrets.EDEN_AI_PRODUCTION_TOKEN }}
          EDEN_AI_MANAGEMENT_KEY: ${{ secrets.EDEN_AI_MANAGEMENT_KEY }}
          # A handful of samples need the model to answer for real, which costs
          # credits on every run. They are reported as skipped on docs PRs and
          # get their coverage from the weekly run and from a manual dispatch.
          EDEN_AI_RUN_PAID_CALLS: ${{ github.event_name != 'pull_request' }}

      # The curl samples are what most readers copy, and nothing ran them until
      # now. Each block runs as its own bash script, so what gets tested is the
      # command on the page rather than a translation of it.
      - name: Run shell snippets
        if: always()
        run: pytest tests/test_snippets_shell.py --no-cov
        env:
          EDEN_AI_BASE_URL: ${{ vars.EDEN_AI_BASE_URL || 'https://staging-api.edenai.run' }}
          EDEN_AI_SANDBOX_API_TOKEN: ${{ secrets.EDEN_AI_SANDBOX_TOKEN }}
          EDEN_AI_PRODUCTION_API_TOKEN: ${{ secrets.EDEN_AI_PRODUCTION_TOKEN }}
          EDEN_AI_MANAGEMENT_KEY: ${{ secrets.EDEN_AI_MANAGEMENT_KEY }}
          EDEN_AI_RUN_PAID_CALLS: ${{ github.event_name != 'pull_request' }}

      # The TypeScript SDK guide is the one integration page written entirely
      # in another language, and nothing ran it until now. Each block runs as
      # its own script, so what gets tested is the code on the page.
      - name: Run JS and TS snippets
        if: always()
        run: pytest tests/test_snippets_js.py --no-cov
        env:
          EDEN_AI_BASE_URL: ${{ vars.EDEN_AI_BASE_URL || 'https://staging-api.edenai.run' }}
          EDEN_AI_SANDBOX_API_TOKEN: ${{ secrets.EDEN_AI_SANDBOX_TOKEN }}
          EDEN_AI_PRODUCTION_API_TOKEN: ${{ secrets.EDEN_AI_PRODUCTION_TOKEN }}
          EDEN_AI_MANAGEMENT_KEY: ${{ secrets.EDEN_AI_MANAGEMENT_KEY }}
          EDEN_AI_RUN_PAID_CALLS: ${{ github.event_name != 'pull_request' }}

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          coverage report -m >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

