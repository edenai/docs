name: Test Documentation Snippets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v3/**/*.mdx'
      - '*.mdx'
      - 'docs.json'
      - 'tests/**'
  schedule:
    - cron: '0 6 * * 1'

# These tests create shared, named resources on one Eden AI account (custom
# tokens, uploaded files), so two runs of the same ref must not overlap.
# update-dates.yml pushes a dateModified bump to every .mdx PR, which starts a
# second run seconds after the first, so serialise them per ref.
#
# Deliberately NOT cancel-in-progress: cleanup happens in pytest_sessionfinish,
# so cancelling a started run orphans the tokens and uploaded file it created.
# The next run then snapshots those as pre-existing and never deletes them,
# leaking a little account state on every .mdx PR. Queuing costs one extra
# minute of CI and always runs cleanup. (A still-pending run carries no
# resources, so GitHub replacing it is harmless.)
concurrency:
  group: test-snippets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    env:
      EDEN_AI_BASE_URL: ${{ vars.EDEN_AI_BASE_URL || 'https://staging-api.edenai.run' }}
      EDEN_AI_SANDBOX_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.EDEN_AI_SANDBOX_TOKEN || '' }}
      EDEN_AI_PRODUCTION_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.EDEN_AI_PRODUCTION_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv pip install -r tests/requirements-lock.txt --system
      - name: Run snippet execution tests
        run: pytest tests/test_snippets_execute.py
      - name: Run validators
        if: always()
        run: |
          pytest \
            tests/config_validator.py \
            tests/api_reference_validator.py \
            tests/model_provider_validator.py \
            tests/link_checker.py
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          coverage report -m >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  ts-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    env:
      EDEN_AI_BASE_URL: ${{ vars.EDEN_AI_BASE_URL || 'https://staging-api.edenai.run' }}
      EDEN_AI_SANDBOX_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.EDEN_AI_SANDBOX_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Python deps (needed for the snippet extractor)
        run: uv pip install -r tests/requirements-lock.txt --system
      - name: Install TS deps
        working-directory: tests/ts
        run: bun install --frozen-lockfile
      - name: Run TS snippet tests
        working-directory: tests/ts
        run: bun test
